name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      react_release_created: ${{ steps.release.outputs['packages/react--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-react:
    name: Build React Distribution
    needs: release-please
    if: needs.release-please.outputs.react_release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun --filter '@a2anet/react' build
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: packages/react/dist/

  publish-react:
    name: Publish React to npm
    needs: build-react
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: packages/react/dist/
      - name: Publish to npm
        working-directory: packages/react
        run: npm publish --provenance --access public
